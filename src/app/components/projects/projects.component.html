<section id="projects" class="section projects">
  <div class="section-inner">
    <div class="section-head">
      <span class="section-head__kicker">Projects</span>
      <h2>Things I've built end to end.</h2>
      <p>A mix of backend systems, applied programming and networking work.</p>
    </div>

    <div class="projects__grid">
      <article class="project-card" *ngFor="let project of portfolio.projects">
        <div class="project-card__stack" aria-hidden="true">
          <span *ngFor="let tech of project.technologies">{{ tech }}</span>
        </div>

        <h3 class="project-card__title">{{ project.title }}</h3>
        <p class="project-card__summary">{{ project.summary }}</p>

        <div class="project-card__actions">
          <button type="button" class="btn btn--ghost" (click)="openProject(project)">
            View Details
          </button>
          <a
            class="project-card__github"
            [href]="project.githubUrl"
            [class.project-card__github--placeholder]="project.githubUrl.startsWith('[')"
            target="_blank"
            rel="noopener"
          >
            GitHub
          </a>
          <a
            *ngIf="project.demoUrl"
            class="project-card__demo"
            [href]="project.demoUrl"
            target="_blank"
            rel="noopener"
          >
            Live Demo
          </a>
        </div>
      </article>
    </div>
  </div>
</section>

<app-project-details
  *ngIf="selectedProject"
  [project]="selectedProject"
  (closed)="closeProject()"
></app-project-details>
